<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Armadillos">
<meta name="theme-color" content="#2F6B1F">
<title>Armadillos</title>
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" href="icon-192.png?v=3">
<link rel="apple-touch-icon" href="icon-192.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F7F2;--ink:#1E2A17;--muted:#5B6653;--line:#CBD3C1;--btn:#FFFFFF;--primary:#2F6B1F;--primary-ink:#FFFFFF;--ok:#2F6B1F;--warn:#8A4B0F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A10;--ink:#E7ECDF;--muted:#A3AE98;--line:#35412D;--btn:#1E2618;--primary:#5E9E3F;--primary-ink:#0E1409;--ok:#8FCB6B;--warn:#F0B36B}}
:root[data-theme="dark"]{--bg:#141A10;--ink:#E7ECDF;--muted:#A3AE98;--line:#35412D;--btn:#1E2618;--primary:#5E9E3F;--primary-ink:#0E1409;--ok:#8FCB6B;--warn:#F0B36B}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:460px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom))}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:2rem;line-height:1;margin:4px 0 4px;letter-spacing:.01em}
.sub{margin:0 0 14px;color:var(--muted);font-size:.95rem}
.fm{display:flex;gap:0;margin:0 auto 12px;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;max-width:340px}
.fm button{flex:1;padding:10px 0;border:0;background:var(--btn);color:var(--ink);font:700 1.15rem "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.03em;cursor:pointer}
.fm button+button{border-left:1.5px solid var(--line)}
.fm button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.fm button:focus-visible{outline:3px solid #F0B36B;outline-offset:-3px}
#board{position:relative;width:100%;max-width:calc((100svh - 330px) * 320 / 600);min-width:260px;margin:0 auto;aspect-ratio:320/600;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#board svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tok{position:absolute;transform:translate(-50%,-50%);padding:5px 11px;border-radius:999px;background:#FFFFFF;color:#1E2A17;border:2px solid #1E2A17;font:600 14px/1 Barlow,system-ui,sans-serif;cursor:grab;touch-action:none;white-space:nowrap;z-index:1;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.tok:focus-visible{outline:3px solid #F0B36B;outline-offset:2px}
.tok.snap{transition:left .16s ease-out,top .16s ease-out}
@media (prefers-reduced-motion:reduce){.tok.snap{transition:none}}
.tok.drag{cursor:grabbing;z-index:5;background:#FFE3B3;border-color:#8A4B0F;transform:translate(-50%,-50%) scale(1.08)}
.row{display:flex;gap:10px;margin-top:14px}
button.act{flex:1;padding:13px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--btn);color:var(--ink);font:600 1rem Barlow,system-ui,sans-serif;cursor:pointer}
button.act.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
button.act:disabled{opacity:.45;cursor:default}
button.act:focus-visible{outline:3px solid #F0B36B;outline-offset:2px}
button.link{background:none;border:0;color:var(--muted);font:500 .9rem Barlow,system-ui,sans-serif;text-decoration:underline;padding:10px 0;cursor:pointer}
#status{min-height:1.4em;margin:10px 0 0;font-size:.95rem;color:var(--muted)}
#status.ok{color:var(--ok)}#status.warn{color:var(--warn)}

.tabs{display:flex;gap:6px;margin:8px 0 14px}
.tabs button{flex:1;padding:9px 0;border-radius:999px;border:1.5px solid var(--line);background:var(--btn);color:var(--ink);font:600 1rem Barlow,system-ui,sans-serif;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button:focus-visible{outline:3px solid #F0B36B;outline-offset:2px}
.game{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--btn)}
.game.next{border-color:var(--primary);border-width:2.5px}
.game.past{opacity:.7}
.game .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.game .when{font:700 1.2rem "Barlow Condensed","Arial Narrow",sans-serif}
.game .opp{font-size:1.05rem;font-weight:600;margin:2px 0}
.game .meta{color:var(--muted);font-size:.9rem}
.tag{font-size:.8rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1.5px solid var(--line);white-space:nowrap}
.res{font:700 1.05rem "Barlow Condensed",sans-serif}
.res.w{color:var(--ok)}.res.l{color:var(--warn)}
.game .acts{display:flex;gap:14px;margin-top:6px}
.game .acts a,.game .acts button{background:none;border:0;padding:4px 0;color:var(--primary);font:600 .95rem Barlow,system-ui,sans-serif;cursor:pointer;text-decoration:underline}
select.pick{width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--btn);color:var(--ink);font:500 1rem Barlow,system-ui,sans-serif}
.board2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.side{border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;background:var(--btn)}
.side.us{border-color:var(--primary)}
.side .nm{font-weight:600;font-size:1rem;min-height:2.4em;display:flex;align-items:center;justify-content:center}
.side .num{font:700 4.2rem/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:6px 0 10px}
.pm{display:flex;gap:8px}
.pm button{flex:1;padding:12px 0;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:700 1.5rem Barlow,system-ui,sans-serif;cursor:pointer}
.pm button.plus{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.stat{display:flex;flex-wrap:wrap;gap:6px}
.stat button{flex:1 1 30%;padding:9px 4px;border-radius:8px;border:1.5px solid var(--line);background:var(--btn);color:var(--ink);font:600 .9rem Barlow,system-ui,sans-serif;cursor:pointer}
.stat button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.picker{border:2px solid var(--primary);border-radius:12px;padding:12px;margin:12px 0;background:var(--btn)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{padding:9px 13px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;color:#1E2A17;font:600 .95rem Barlow,system-ui,sans-serif;cursor:pointer}
.chips button.skip{background:var(--bg);color:var(--ink);border-color:var(--line)}
.log{list-style:none;padding:0;margin:8px 0 0}
.log li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.98rem}
.log li button{background:none;border:0;color:var(--muted);font-size:1.1rem;padding:4px 8px;cursor:pointer}
h2{font:700 1.3rem "Barlow Condensed",sans-serif;margin:18px 0 4px}
.clock{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px;background:var(--btn)}
.clock .tm{font:700 2.4rem/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;min-width:4.2ch}
.clock .info{flex:1;min-width:0;font-size:.9rem;color:var(--muted);line-height:1.3}
.clock .info b{color:var(--ink);font-weight:600}
.clock button{padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 .95rem Barlow,system-ui,sans-serif;cursor:pointer}
.clock button.go{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.clock.big .tm{font-size:3.2rem}
.clock.running .tm{color:var(--ok)}
.ro .pm,.ro #statusBtns,.ro #sGo,.ro #sReset,.ro #lGo,.ro #picker{display:none!important}
.lro .fm,.lro .row,.lro #share,.lro #reset,.lro #coach,.lro #status{display:none!important}
.lro .tok{cursor:default}
.pt{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:14px 0 0;background:var(--btn)}
.pt h2{margin:0 0 6px}
.pt .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pt select{padding:7px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 .9rem Barlow,system-ui,sans-serif}
.ptrow{display:grid;grid-template-columns:3.2em 1fr 3.4em;align-items:center;gap:8px;padding:5px 0;font-size:.95rem}
.ptrow .ini{font-weight:700}
.ptrow .bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.ptrow .bar i{display:block;height:100%;background:var(--muted)}
.ptrow.on .bar i{background:var(--primary)}
.ptrow .mm{text-align:right;font-variant-numeric:tabular-nums}
.ptrow.on .ini::after{content:" •";color:var(--ok)}
.ptnote{font-size:.85rem;color:var(--muted);margin:6px 0 0}
.clock.subnow{border-color:#B3261E;background:#FCE8E6}
.clock.subnow .info b{color:#B3261E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .clock.subnow{background:#3A1411}}
:root[data-theme="dark"] .clock.subnow{background:#3A1411}
.ro .pt{display:none!important}
</style>
</head>
<body>
<main>
<h1>Armadillos</h1>
<nav class="tabs" role="tablist"><button role="tab" data-tab="lineup" id="t-lineup">Lineup</button><button role="tab" data-tab="schedule">Schedule</button><button role="tab" data-tab="score">Score</button></nav>
<section id="tab-lineup">
<div class="clock" id="lclock"><span class="tm" id="lTm">0:00</span><span class="info" id="lInfo"></span><button class="go" id="lGo">Start</button></div>
<p class="sub" id="lsub">Pick a formation, then drag names onto spots. Dropping on another player swaps them.</p>
<div class="fm" role="group" aria-label="Formation"><button data-f="321">3-2-1</button><button data-f="222">2-2-2</button><button data-f="231">2-3-1</button></div>
<div id="board">
<svg viewBox="0 0 320 600" aria-hidden="true">
<rect x="0" y="0" width="320" height="470" rx="6" fill="#2F6B1F"/>
<g fill="#387A25"><rect x="0" y="47" width="320" height="47"/><rect x="0" y="141" width="320" height="47"/><rect x="0" y="235" width="320" height="47"/><rect x="0" y="329" width="320" height="47"/><rect x="0" y="423" width="320" height="47"/></g>
<g fill="none" stroke="#F4F7EE" stroke-width="2" stroke-opacity=".85">
<rect x="2" y="2" width="316" height="466" rx="5"/>
<line x1="2" y1="235" x2="318" y2="235"/>
<circle cx="160" cy="235" r="40"/>
<rect x="80" y="2" width="160" height="60"/>
<rect x="80" y="408" width="160" height="60"/>
</g>
<g id="labels" font-family="Barlow,sans-serif" font-size="12" font-weight="600" fill="#F4F7EE" fill-opacity=".9" text-anchor="middle"></g>
<rect x="0" y="480" width="320" height="120" rx="10" fill="#E3E8D9"/>
<text x="12" y="499" font-size="13" font-weight="600" fill="#4A5541" font-family="Barlow,sans-serif">Bench</text>
</svg>
</div>
<div class="row">
<button class="act primary" id="save" disabled>Save lineup</button>
<button class="act" id="undo" disabled>Undo changes</button>
</div>
<p id="status" role="status"></p>
<button class="act" id="share" style="width:100%;margin-top:10px">Share this lineup</button>
<button class="link" id="reset">Reset this formation</button>
<button class="link" id="coach" hidden style="margin-left:14px">Copy coach link</button>
<p id="sync" style="margin:4px 0 0;font-size:.85rem;color:var(--muted)"></p>
<div class="pt" id="ptBox"><div class="hd"><h2>Playing time</h2><label style="font-size:.9rem;color:var(--muted)">Sub alert <select id="subInt" aria-label="Sub alert interval"><option value="0">Off</option><option value="4">4 min</option><option value="5">5 min</option><option value="6">6 min</option><option value="8">8 min</option><option value="10">10 min</option><option value="12">12 min</option></select></label></div><div id="ptList"></div><p class="ptnote" id="ptNote"></p></div>
</section>
<section id="tab-schedule" hidden>
<p class="sub">2026 Kaufman SA Rec League, 10U. All games at Kaufman Sports Complex.</p>
<div id="games"></div>
<button class="act" id="parentLink" hidden style="width:100%">Share parent link</button>
</section>
<section id="tab-score" hidden>
<select class="pick" id="gpick" aria-label="Game"></select>
<div class="board2">
<div class="side us"><div class="nm">Armadillos</div><div class="num" id="sUs">0</div><div class="pm"><button id="usMinus" aria-label="Remove Armadillos goal">−</button><button class="plus" id="usPlus" aria-label="Add Armadillos goal">+</button></div></div>
<div class="side"><div class="nm" id="oppName">Opponent</div><div class="num" id="sThem">0</div><div class="pm"><button id="thMinus" aria-label="Remove opponent goal">−</button><button class="plus" id="thPlus" aria-label="Add opponent goal">+</button></div></div>
</div>
<div class="clock big" id="sclock"><span class="tm" id="sTm">0:00</span><span class="info" id="sInfo"></span><button class="go" id="sGo">Start</button><button id="sReset">Reset</button></div>
<div class="picker" id="picker" hidden><strong>Who scored?</strong><div class="chips" id="chips"></div></div>
<div class="stat" id="statusBtns"></div>
<h2>Goals</h2>
<ul class="log" id="glog"></ul>
<p id="ssync" style="margin:10px 0 0;font-size:.85rem;color:var(--muted)"></p>
</section>
</main>
<script id="lineup-state">window.LINEUP={"formation":"321","lineups":{"321":{"VS":"F","LR":"LM","AR":"RM","JN":"LB","MC":"CB","BS":"RB","RM":"GK","RR":"B1","PT":"B2","LJ":"B3","JO":"B4"},"222":{"VS":"LF","RR":"RF","LR":"LM","AR":"RM","JN":"LB","MC":"RB","RM":"GK","BS":"B1","PT":"B2","LJ":"B3","JO":"B4"},"231":{"VS":"F","LR":"LM","BS":"CM","AR":"RM","JN":"LB","MC":"RB","RM":"GK","RR":"B1","PT":"B2","LJ":"B3","JO":"B4"}}};</script>
<script>
(function(){
var BENCH={B1:[90,530],B2:[230,530],B3:[90,572],B4:[230,572]};
var FORMS={
 "321":{GK:[160,428,"Keeper"],LB:[60,320,"Left back"],CB:[160,340,"Center back"],RB:[260,320,"Right back"],LM:[90,170,"Left mid"],RM:[230,170,"Right mid"],F:[160,90,"Forward"]},
 "222":{GK:[160,428,"Keeper"],LB:[95,330,"Left back"],RB:[225,330,"Right back"],LM:[90,180,"Left mid"],RM:[230,180,"Right mid"],LF:[100,92,"Left forward"],RF:[220,92,"Right forward"]},
 "231":{GK:[160,428,"Keeper"],LB:[95,330,"Left back"],RB:[225,330,"Right back"],LM:[58,180,"Left mid"],CM:[160,152,"Center mid"],RM:[262,180,"Right mid"],F:[160,80,"Forward"]}
};
var DEFAULT=JSON.parse(JSON.stringify(window.LINEUP_DEFAULT||null))||{"formation":"321","lineups":{"321":{"VS":"F","LR":"LM","AR":"RM","JN":"LB","MC":"CB","BS":"RB","RM":"GK","RR":"B1","PT":"B2","LJ":"B3","JO":"B4"},"222":{"VS":"LF","RR":"RF","LR":"LM","AR":"RM","JN":"LB","MC":"RB","RM":"GK","BS":"B1","PT":"B2","LJ":"B3","JO":"B4"},"231":{"VS":"F","LR":"LM","BS":"CM","AR":"RM","JN":"LB","MC":"RB","RM":"GK","RR":"B1","PT":"B2","LJ":"B3","JO":"B4"}}};
var NAMES=Object.keys(DEFAULT.lineups["321"]);
var W=320,H=600,KEY='u10-lineup-board-standalone';
function copy(o){return JSON.parse(JSON.stringify(o))}
function slotsFor(f){var o={};Object.keys(FORMS[f]).forEach(function(k){o[k]=FORMS[f][k]});Object.keys(BENCH).forEach(function(k){o[k]=BENCH[k]});return o}
function validLine(f,l){if(!l)return false;var S=slotsFor(f),used={};return NAMES.every(function(n){var v=l[n];if(typeof v!=='string'||!S[v]||used[v])return false;used[v]=1;return true})}
function normalize(st){
  var out=copy(DEFAULT);if(!st)return out;
  if(!st.lineups){if(validLine("321",st))out.lineups["321"]=copy(st);return out}
  Object.keys(FORMS).forEach(function(f){if(validLine(f,st.lineups[f]))out.lineups[f]=copy(st.lineups[f])});
  if(FORMS[st.formation])out.formation=st.formation;return out}
var saved=normalize(window.LINEUP);
try{var raw=localStorage.getItem(KEY);if(raw)saved=normalize(JSON.parse(raw))}catch(e){}
var local=null,fromLink=false;
try{if(location.hash.length>1){local=normalize(JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1))))));fromLink=true}}catch(e){local=null}
var cur=copy(saved);
var board=document.getElementById('board'),labels=document.getElementById('labels'),toks={};
var saveBtn=document.getElementById('save'),undoBtn=document.getElementById('undo'),st=document.getElementById('status');
var fmBtns=[].slice.call(document.querySelectorAll('.fm button'));
var artifactApi=null,busy=false;
function msg(t,c){st.textContent=t;st.className=c||''}
function S(){return slotsFor(cur.formation)}
function L(){return cur.lineups[cur.formation]}
function posTo(t,x,y){t.style.left=(x/W*100)+'%';t.style.top=(y/H*100)+'%'}
function place(n){var p=S()[L()[n]];posTo(toks[n],p[0],p[1])}
function drawLabels(){var F=FORMS[cur.formation],h='';Object.keys(F).forEach(function(k){var p=F[k];h+='<text x="'+p[0]+'" y="'+(p[1]+32)+'">'+p[2]+'</text>'});labels.innerHTML=h}
function renderAll(){fmBtns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.f===cur.formation?'true':'false')});drawLabels();NAMES.forEach(place)}
function refresh(){if(typeof ptSync==='function')ptSync();var d=JSON.stringify(cur)!==JSON.stringify(saved);saveBtn.disabled=!d||busy;undoBtn.disabled=!d||busy;if(d)msg('Unsaved changes.','warn');else if(st.className==='warn')msg('','');return d}
function whoAt(slot){var l=L();return NAMES.filter(function(n){return l[n]===slot})[0]}
function moveTo(n,slot){var l=L();if(l[n]===slot){place(n);return}var o=whoAt(slot);if(o){l[o]=l[n];place(o)}l[n]=slot;place(n);refresh()}
function nearest(x,y){var best=null,bd=1e9,Sl=S();Object.keys(Sl).forEach(function(k){var p=Sl[k],d=(p[0]-x)*(p[0]-x)+(p[1]-y)*(p[1]-y);if(d<bd){bd=d;best=k}});return best}
NAMES.forEach(function(n){
  var t=document.createElement('div');t.className='tok snap';t.textContent=n;t.tabIndex=0;
  t.setAttribute('role','button');t.setAttribute('aria-label',n+'. Drag to a spot, or use arrow keys to change spots.');
  board.appendChild(t);toks[n]=t;
  var last=null;
  t.addEventListener('pointerdown',function(e){if(LRO)return;e.preventDefault();t.setPointerCapture(e.pointerId);t.classList.remove('snap');t.classList.add('drag')});
  t.addEventListener('pointermove',function(e){
    if(!t.hasPointerCapture(e.pointerId))return;
    var r=board.getBoundingClientRect();
    var x=Math.min(Math.max((e.clientX-r.left)/r.width*W,24),W-24);
    var y=Math.min(Math.max((e.clientY-r.top)/r.height*H,14),H-14);
    last=[x,y];posTo(t,x,y);
  });
  function end(e){if(t.hasPointerCapture(e.pointerId))t.releasePointerCapture(e.pointerId);t.classList.remove('drag');t.classList.add('snap');if(last){moveTo(n,nearest(last[0],last[1]));last=null}else place(n)}
  t.addEventListener('pointerup',end);t.addEventListener('pointercancel',end);
  t.addEventListener('keydown',function(e){if(LRO)return;
    var d={ArrowLeft:-1,ArrowUp:-1,ArrowRight:1,ArrowDown:1}[e.key];if(!d)return;e.preventDefault();
    var order=Object.keys(S()),i=order.indexOf(L()[n]);moveTo(n,order[(i+d+order.length)%order.length]);
  });
});
fmBtns.forEach(function(b){b.onclick=function(){if(cur.formation===b.dataset.f)return;cur.formation=b.dataset.f;renderAll();refresh()}});
renderAll();
if(local&&JSON.stringify(local)!==JSON.stringify(saved)){cur=local;renderAll();refresh();msg('Showing the lineup from your link. Tap Save lineup to keep it on this phone.','warn')}
if(fromLink)history.replaceState(null,'',location.pathname+location.search);
var TEAM=null,remote=null,writeDoc=null,syncEl=document.getElementById('sync');
try{var q=new URLSearchParams(location.search).get('team');if(q&&/^[a-z0-9]{20,40}$/.test(q)){TEAM=q;localStorage.setItem(KEY+'-team',q)}else TEAM=localStorage.getItem(KEY+'-team')}catch(e){}
function sync(t){syncEl.textContent=t}
function applyRemote(st){
  var dirty=JSON.stringify(cur)!==JSON.stringify(saved);
  saved=st;try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}
  if(!dirty){cur=copy(st);renderAll();refresh()}
  else{refresh();msg('Your coach saved a change. Tap Undo changes to see it, or Save to keep yours.','warn')}
}
saveBtn.onclick=function(){
  var st=copy(cur);
  try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}
  saved=st;refresh();
  if(writeDoc){writeDoc(st).then(function(){msg('Saved and shared with your coach.','ok')},function(){msg('Saved on this phone. It will sync when you have signal.','warn')});msg('Saving…','')}
